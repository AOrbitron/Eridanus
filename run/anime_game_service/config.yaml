steamsnooping:
  is_snooping: False    #是否开启Steam视奸功能
  steam_api_key:      #需要您自行申请写入一个或多个Steam Api Key，申请地址：https://partner.steamgames.com/doc/webapi_overview/auth
    - 1234567

  game_white:         #Steam游戏播报白名单，在此名单内的游戏不会被bot播报
    - Wallpaper Engine
    - MyDockFinder
    - MyDockerFinder
    - DSX
    - Source SDK

mihuyo_club:
  update_resource_auto: true # 启动时自动更新游戏攻略资源
  zzz:
    resource_source: "auto" # 自动测速选择资源镜像，也可指定镜像名称
    first_resource: "猫冬" # 优先使用的攻略提供方：猫冬、听雨惊花

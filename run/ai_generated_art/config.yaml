  反推和审核使用模型: 'wd14-vit-v2-git'
  sd图片是否保存到生图端: true
  sd画图默认分辨率: '1280,1728' # 宽,高 (1200-1800 区间)
  sd最大分辨率: '1800,1800'
  sd队列长度限制: 6
  sd超时时间: 600
  ai绘画所需权限等级: 0
  内置ai绘画1所需权限等级: 0
  内置ai绘画2所需权限等级: 0
  内置ai绘画3所需权限等级: 0

  qwen_image_cookie: ""

  nano_banana_key:
  -  ""
  nano_banana_config:
    model: gemini-3-pro-image-preview
    base_url: "https://generativelanguage.googleapis.com"
    原生gemini接口: false
    quest_url: "http://fku.com/v1/chat/completions"
    nano_banana不限制次数所需权限: 1
    nano_banana默认权限用户可用次数: 10
    temperature: 1

  禁止nsfw: false
  allow_nsfw_groups:
  - 879886836
  其他默认绘图参数:
    - --d 0.7
    - --p {},rating:general, best quality, very aesthetic, absurdres
    - --n blurry, lowres, error, film grain, scan artifacts, worst quality, bad quality, jpeg artifacts, very displeasing, chromatic aberration, logo, dated, signature, multiple views, gigantic breasts
    - --steps 28
    - --sampler Euler a
    - --scheduler Automatic
    - --nai-sampler k_euler_ancestral
    - --nai-scheduler karras
    - --cfg 4.5
    - --nai-cfg 5
    - --ns 5
    - --nf 20
    - --overmask 64

suno:
  cookie: ""
  unlimited_permission: 5
  default_user_uses: 3

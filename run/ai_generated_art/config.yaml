# 统一文生图 Function Calling 后端选择
# 可选值: "comfyui", "sd", "gptimage2", "gpt_official", "nano_banana", "novelai"
文生图function_calling后端: "sd"

# 大模型生图控制与提示词优化配置 (支持 ComfyUI 参数控制 及 SD 纯 Danbooru 词条转换优化)
# 留空则自动回退到 core_reply 主回复模型
llm_config:
  base_url: ""
  apikey: ""
  model: ""
  temperature: 0.7

# ComfyUI 绘图配置 (支持 Anima DiT 架构及实验性主回复模型控制节点)
comfyui:
  url: "" # ComfyUI 服务地址（Cloudflare Tunnel 穿透URL）
  comfyui画图: true # 是否开启 ComfyUI 后端
  主模型控制生图: false # 实验性功能：是否调用主回复模型/配置的LLM来智能解析提示词、匹配LoRA及生成节点
  default_unet: "anima-base-v1.0.safetensors" # 默认UNet底模
  default_clip: "qwen_3_06b_base.safetensors" # 默认CLIP
  default_vae: "qwen_image_vae.safetensors" # 默认VAE
  default_lora: "lily_wuthering_waves_v1.0_Anima.safetensors" # 默认/首选LoRA模型
  default_lora_strength: 0.9 # 默认LoRA权重
  # 固定链式加载的 LoRA 列表（轻量化配置：仅保留轻度 Rella 与低权重鬼针草，避免过重叠加扭曲角色原本五官）
  fixed_loras:
    - name: "re-000180.safetensors"
      strength: 0.35
      trigger: "@shu, (Rella:1.05)"
    - name: "chen-bin_v4.0.safetensors"
      strength: 0.20
      trigger: "(@4x0style:0.75)"
  default_steps: 30 # 默认采样步数 (28-60)
  default_cfg: 5.0 # 默认CFG
  default_sampler: "er_sde" # 默认采样器
  default_scheduler: "beta" # 默认调度算法（服务端若安装 RES4LYF 则支持 beta57，否则自动使用 beta）
  default_width: 1280 # 默认出图宽度 (1200-1800)
  default_height: 1728 # 默认出图高度 (1200-1800)
  timeout: 300 # 超时时间(秒)
  decrypt_encrypted_image: true # 是否对 pixel_shuffle 加密图片自动还原解密
  decrypt_password: "1234" # 解密密码
  enable_teacache: true # 是否开启推理缓存加速（优先使用 AnimaTeaCache，未安装则自动使用 ComfyUI 原生 EasyCache）
  teacache_thresh: 0.35 # TeaCache 缓存阈值（参考工作流推荐 0.35）
  enable_hires_fix: false # 默认关闭耗时的两阶段 Hires Fix（单阶段高速直出，避免耗时翻倍与面部偏移）
  hires_scale: 1.333 # 高清精修放大倍数（仅当手动开启 enable_hires_fix 时生效）
  hires_denoise: 0.38 # 高清精修第二阶段重绘幅度
  hires_steps: 15 # 高清精修第二阶段采样步数
  default_img2img_denoise: 0.65 # 以图生图默认重绘幅度 (0.2~0.85)

# OpenAI 官方 DALL-E 接口配置 (或兼容 OpenAI images/generations 的第三方中转)
gpt_official:
  base_url: "https://api.openai.com/v1" # 官方接口地址或第三方中转地址
  apikey: "" # API Key
  model: "dall-e-3" # 可选: "dall-e-3", "dall-e-2"
  size: "1024x1024" # 可选: "1024x1024", "1024x1792", "1792x1024"
  quality: "standard" # 可选: "standard", "hd"
  style: "vivid" # 可选: "vivid", "natural"
  timeout: 120 # 超时时间(秒)

sightengine:       #ai创作图片鉴别，自己去申请https://dashboard.sightengine.com/api-credentials
  api_user: ''
  api_secret: ''

gptimage2:
  base_url: "http://api.apollodorus.xyz/v1" # gptimage2 API 基础地址
  权限要求: 0   #使用gptimage2功能所需的权限等级，超过此等级不受次数限制
  model: "gpt-image-2.5-flare"   # 模型名称，当前可用的模型有 "gpt-image-2.5-flare" 和 "nano-banana-2"
  apikey: ''  # 接口apikey
  sticker_style_ref: "data/system/sticker_template_3x3.png" # 表情包画风参考图片路径
  sticker_resolution: "1K" # 表情包生成分辨率
  aspect_ratio: '1:1'  # 生成图像的宽高比
  resolution: "1K"  # 1K 或 2K
  max_retry: 5 #最大重试次数
  接管sd: false  #开启后将接管sd画图功能
  bot_oc: "data/system/bot_oc.png" # bot的形象设定png
  extra_prompt: "赛璐璐风格。不必绘制过于繁复的服饰细节和发丝，不用完全还原参考图细节，保持角色可识别即可。允许简化。保持图片清晰"
  character_anchor: "的固定外貌特征如下：银白色长发及肩以下且发尾带淡蓝微光，单根呆毛，耳侧小发髻别着两朵淡粉樱花发饰，雾霾蓝与浅粉色渐变双色瞳带纤细精致睫毛，圆润可爱少女脸型；标志性服装为白色不对称吊带礼裙，腰间系蓝色细带蝴蝶结，裙摆呈不规则燕尾形；白色过膝袜配白色高跟鞋"

ai绘画:
  # 并发指令触发绘图开关（同一级别独立控制）
  sd画图: false # SD接口开关 (目前暂无服务端，保留配置以便配置后使用)
  comfyui画图: true # ComfyUI绘图开关
  novel_ai画图: false # NovelAI (nai4) 绘图开关
  内置ai绘画1开关: true  # 聚合接口 (bing, flux, doubao)
  内置ai绘画2开关: true  # NoobXL-V-pred-v1.0，来自 modelscope
  内置ai绘画3开关: false # ani4，来自 hugging face
  gptimage2画图: false # 指令触发是否参与并发
  nano_banana画图: false # 指令触发是否参与并发

  sdUrl:
    - ''
  apikey: '' # sd的api key
  sd审核和反推api: ''
  nai_key:
    - ''
  sd默认启动模型: 'waiIllustriousSDXL_v170.safetensors'
  反推和审核使用模型: 'wd14-vit-v2-git'
  sd图片是否保存到生图端: true
  sd画图默认分辨率: '1280,1728' # 宽,高 (1200-1800 区间)
  sd最大分辨率: '1800,1800'
  sd队列长度限制: 6
  sd超时时间: 600
  ai绘画所需权限等级: 0
  内置ai绘画1所需权限等级: 0
  内置ai绘画2所需权限等级: 0
  内置ai绘画3所需权限等级: 0

  qwen_image_cookie: ""

  nano_banana_key:
  -  ""
  nano_banana_config:
    model: gemini-3-pro-image-preview
    base_url: "https://generativelanguage.googleapis.com"
    原生gemini接口: false
    quest_url: "http://fku.com/v1/chat/completions"
    nano_banana不限制次数所需权限: 1
    nano_banana默认权限用户可用次数: 10
    temperature: 1

  禁止nsfw: false
  allow_nsfw_groups:
  - 879886836
  其他默认绘图参数:
    - --d 0.7
    - --p {},rating:general, best quality, very aesthetic, absurdres
    - --n blurry, lowres, error, film grain, scan artifacts, worst quality, bad quality, jpeg artifacts, very displeasing, chromatic aberration, logo, dated, signature, multiple views, gigantic breasts
    - --steps 28
    - --sampler Euler a
    - --scheduler Automatic
    - --nai-sampler k_euler_ancestral
    - --nai-scheduler karras
    - --cfg 4.5
    - --nai-cfg 5
    - --ns 5
    - --nf 20
    - --overmask 64

suno:
  cookie: ""
  unlimited_permission: 5
  default_user_uses: 3

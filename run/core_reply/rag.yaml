enable: false  # RAG 为独立的长期记忆系统，既可单用，也可与 impression/slots 共存。
integration_mode: replace  # replace: 回复只注入RAG；augment: 与旧记忆叠加（不保证省token）
db_path: data/dataBase/mai_rag_memory.db
private:
  enable: true
group:
  enable: true
  whitelist_enabled: false  # false全开群；true配合下方名单，为空时自动读取trigger_llm白名单群
  whitelist: []
  observe_untriggered: true  # 旁观消息也做语义分析并参与检索，但绝不替群友抢答
embedding:
  provider: openai  # cloudflare: Workers AI；openai: 兼容接口 / 本地 Embedding 服务
  base_url: http://api.apollodorus.xyz/v1
  endpoint: embeddings
  model: qwen3-embedding-4b
  api_key: ''
  api_key_env: MAI_RAG_API_KEY  # 运行时优先读取环境变量
  timeout_seconds: 15
  dimensions: 2560  # qwen3-embedding-4b 维度
  query_instruction: Given a conversation query, retrieve relevant past conversations and memories
  cloudflare:
    account_id: ''
    model: '@cf/baai/bge-m3'
    api_token: ''
    api_token_env: CLOUDFLARE_API_TOKEN
    timeout_seconds: 30
    query_instruction: ''
archive:
  private_turns: 6  # 每6轮完整用户/Bot对话归档一次并抽取Mem0原子事实
  group_messages: 10  # 群内累计15条用户消息归档，Bot发言一起沉淀
  idle_seconds: 600  # 超过阈值但尾部空闲10分钟后归档；0表示关闭空闲补归档
  max_buffer_chars: 6000
  max_buffer_messages: 200
  chunk_chars: 1800
  overlap_messages: 2
  context_gap_seconds: 1800
index:
  max_message_chars: 16000
  batch_size: 16
  retry_seconds: 60
  max_pending: 10000
logging:
  enable: true
retention:
  days: 365
  max_per_scope: 4000
retrieval:
  mode: adaptive
  context_messages: 4
  context_chars: 700
  query_cache_seconds: 300
  query_cache_size: 256
  anchor_seconds: 1800
  ambiguity_margin: 0.08
  top_k: 8
  min_similarity: 0.35
  max_prompt_tokens: 1500  # 充足的token预算，彻底消除截断
  max_prompt_chars: 1200   # 充足的字符预算
  timeout_seconds: 15.0

# 系统总开关：true 开启衣橱管理与自动换装；false 使用默认设置
enabled: true
# 默认服装与当前生效着装状态
default_outfit: 默认常服
current_outfit: 机能风骑行皮衣
current_outfit_tags: cool biker girl, cropped black motorcycle leather jacket, 
  neon blue accents, black tactical cargo pants with utility straps, fingerless 
  leather gloves, combat boots, futuristic cyberpunk garage background, neon 
  signs, confident smirk
today_default_outfit: 默认常服
today_default_tags: smirk, mischievous smile, wink, street style, oversized 
  jacket, casual clothes
last_daily_date: '2026-11-05'
# 角色外观基础锚点（从 yucca.txt 解耦迁移，保持外貌特征统一）
character_anchor: 1girl, adult woman, 21 years old, solo, grey hair, gradient hair, multicolored 
  hair, blue hair, light purple-light blue mixed eyes, (Side swept hair:1.6), 
  ahoge, bangs, middle long hair, (round face:1.2)
# 画风、LoRA 与质量锚点
art_anchor: (Rella:1.2), (chen bin:1.3), virtual youtuber, 
  (starshadowmagician:1.2), masterpiece, extremely detailed, lineart, 
  (hand-drawn:1.3), (sketch:1.2), Picasso style, Van Gogh's almond blossoms, 
  <lora:DeniaV1-Nuclear1811-IL:0.5>
# SD 负向提示词
negative_prompt: lowres, bad anatomy, bad hands, text, error, missing fingers, 
  extra digit, fewer digits, cropped, worst quality, low quality, normal 
  quality, jpeg artifacts, signature, watermark, username, blurry, nsfw

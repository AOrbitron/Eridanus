
user_handle_logic: blacklist #模式。可填 blacklist, whitelist。blacklist下，屏蔽指定用户，whitelist下，只处理指定用户。
user_handle_logic_operate_level: 1000 #拉黑、解黑用户所需操作权限
group_handle_logic: blacklist #模式。可填 blacklist, whitelist。blacklist下，屏蔽指定群，whitelist下，只处理指定群。
group_handle_logic_operate_level: 1000 #拉黑、解黑群所需操作权限
邀请bot加群所需权限: 0
申请bot好友所需权限: 0

webui:
  enable: true
  auth_token: "" # webui 5007 ws server token #是否开启web ui
telegram:
  enable: false
  bot_token: ""
  proxy: ""
record_mface: true #是否收集主人的表情包
proxy:
  http_proxy: ""
  socks_proxy: ""
bot: "Eridanus"   #机器人昵称
master:
  name: "管理员"
  id: 1840094972
group: 879886836   #测试群号1，随便建个小群。bot会往里面发乱七八糟的东西，不要填用户群。
# 协议配置：支持 onebot_v11 与 milky (可配置多个服务端/客户端地址与鉴权Token)
protocol:
  type: "onebot_v11"   # 协议类型：可选 "onebot_v11" 或 "milky"，默认使用 onebot_v11
  
  # OneBot V11 协议配置
  onebot_v11:
    adapter_name: "any"
    access_token: ""   # OneBot 鉴权 token，默认为空
    ws_client:         # Eridanus 作为 WebSocket 客户端主动连接
      enable: true
      url: "ws://127.0.0.1:3001"
    http_client:       # Eridanus 作为 HTTP 客户端调用 OneBot API
      enable: false
      url: "http://127.0.0.1:3000"
    ws_server:         # Eridanus 作为 WebSocket 服务端（反向WS），默认关闭
      enable: false
      host: "0.0.0.0"
      port: 8080
    http_server:       # Eridanus 作为 HTTP 服务端接收事件推送，默认关闭
      enable: false
      host: "0.0.0.0"
      port: 8081

  # Milky (1.3) 协议配置（适用于 Yogurt 等 Milky 协议实现）
  milky:
    access_token: ""   # Milky 鉴权 token，默认为空（Bearer Token）
    client:            # Eridanus 主动连接 Milky 服务端
      enable: true
      api_url: "http://127.0.0.1:3001"        # Milky HTTP API 根地址
      api_timeout: 60                         # 单次请求超时秒数；发送超时不自动重发，避免重复消息
      event_ws_url: "ws://127.0.0.1:3001/event" # Milky 事件流 WebSocket 地址
    webhook_server:    # Eridanus 作为 Webhook 服务端接收事件上报，默认关闭
      enable: false
      host: "0.0.0.0"
      port: 8082

PluginLoadConfig: #插件加载配置，根据配置情况调整。会影响插件加载速度。
  load_strategy: "batch_loading" #加载策略，可选batch_loading，all_at_once，memory_aware
  batch_size: 4  # 每批加载的插件数量
  batch_delay: 2  # 批次间延迟（秒）
  max_retries: 3  # 最大重试次数
  retry_delay: 1  # 重试延迟（秒）
  memory_threshold_mb: 200  # 内存阈值（MB）
  enable_gc_between_batches: True  # 批次间是否强制垃圾回收
HandlerMonitor:   #消息处理器超时检测
  enable: false
  handler_timeout_warning: 15  # 处理超时警告（秒）
redis: #redis数据库相关设置，如果您不清楚请不要乱动
  redis_ip: default       #默认即为本机ip，若您使用docker安装，请填您的docker网桥
  redis_port: default
  redis_db: default


git_update_source: 0 # 默认更新使用的Git源序号：0为官方GitHub源(https://github.com/avilliai/Eridanus.git)，1为GitCode源，未配置时默认为0


pypi_source: "https://mirrors.aliyun.com/pypi/simple/" # PyPI 镜像源配置：默认阿里源(https://mirrors.aliyun.com/pypi/simple/)，海外机器或需要官方源可配置为 https://pypi.org/simple/ 或其他镜像

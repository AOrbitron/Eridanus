# QQ空间插件配置
cookie设置:
  保活: true               # 是否开启保活探测
  保活间隔_秒: 1800        # 保活探测间隔（建议>=1800秒，温和低频，防止风控）
  失效通知: true           # cookie失效时私聊通知管理员手动输入/qzone login
  失效时自动重新登陆: false # 强烈建议保持false，避免循环扫码导致账号风控

定时发空间:
  早安:
    enable: true
    time: 8/30           # 推送时间 (时/分)
    绘制图片: true         # 是否通过SD绘制配图
  晚安:
    enable: true
    time: 22/30          # 推送时间 (时/分)
    绘制图片: true         # 是否通过SD绘制配图

vtuber日常互动:
  enable: true             # 是否开启活人感/Vtuber风格日常动态
  巡检间隔_分钟: 60        # 每次巡检间隔
  每日最大发送次数: 3      # 每天最多发送条数
  触发概率: 0.35           # 巡检满足条件时的触发概率(0.0~1.0)
  活跃时间段: 10-21      # 仅在白天活跃时段判断触发
  绘制图片概率: 0.7        # 是否配图的概率

sd绘画设置:
  sdUrl: "" # Stable Diffusion API 地址
  apikey: "" #sd apikey，如果需要的话
  steps: 28              # 采样步数
  cfg_scale: 7.0         # 提示词引导系数(对齐SDXL)
  width: 1024            # 图片宽度
  height: 1024           # 图片高度
  timeout: 120           # 绘画接口超时时间(秒)

动态互动:
  enable_comment_reply: true  # 是否自动回复空间好友在Bot动态下的评论
  check_interval_秒: 180      # 评论巡检轮询间隔(秒)

# 角色绘图提示词设置（由用户自定义不同Bot角色的外貌与画风，不依赖角色卡格式，留空则使用默认形象）
角色绘图设置:
  基础形象设定: "1girl, teenager, solo, grey hair, gradient hair, multicolored hair, blue hair, light purple-light blue mixed eyes, (Side swept hair:1.6), ahoge, bangs, middle long hair, (round face:1.2)"
  画风与模型设定: "(Rella:1.2), (chen bin:1.3), virtual youtuber, (starshadowmagician:1.2), masterpiece, extremely detailed, lineart, (hand-drawn:1.3), (sketch:1.2), Picasso style, Van Gogh's almond blossoms, <lora:DeniaV1-Nuclear1811-IL:0.5>"
  默认服装设定: "hair ornament,detached sleeves, hair bow, flower, off shoulder,layered dress, virtual youtuber,lace rim, ornaments sleeves, lolita sleeves,white pantyhose"
  负面提示词: "lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, nsfw"
